version: 2.1

jobs:
  build-test-sonar:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0.402
    steps:
      - checkout
      - run:
          name: Install SonarScanner and PR lookup tools
          command: |
            apt-get update
            apt-get install --yes --no-install-recommends curl jq
            rm -rf /var/lib/apt/lists/*
            dotnet tool install --global dotnet-sonarscanner --version 12.0.0
            dotnet tool install --global trx2junit --version 2.1.0 --allow-roll-forward
            echo 'export PATH="$PATH:/root/.dotnet/tools"' >> "$BASH_ENV"
      - run:
          name: Restore solution
          command: dotnet restore Fft.sln --locked-mode
      - run:
          name: Begin SonarQube Cloud analysis
          command: |
            if [[ -z "${SONAR_TOKEN:-}" ]]; then
              echo "SONAR_TOKEN must be configured in the CircleCI context."
              exit 1
            fi

            sonar_args=(
              "/k:jonwong84_fft-experimental-project"
              "/o:jonwong84"
              "/d:sonar.token=${SONAR_TOKEN}"
            )

            if [[ "${SONAR_REGION:-}" == "us" ]]; then
              sonar_args+=("/d:sonar.region=us")
            fi

            if [[ -n "${CIRCLE_PULL_REQUEST:-}" ]]; then
              if [[ -z "${GITHUB_TOKEN:-}" ]]; then
                echo "GITHUB_TOKEN must be configured in the CircleCI context to look up the PR target branch."
                exit 1
              fi

              pull_request_url="${CIRCLE_PULL_REQUEST%%[?#]*}"
              pull_request_url="${pull_request_url%/}"
              pull_request_number="${pull_request_url##*/}"
              if [[ ! "${pull_request_number}" =~ ^[0-9]+$ ]]; then
                echo "Could not extract a valid pull request number from CIRCLE_PULL_REQUEST."
                exit 1
              fi

              pull_request_json=$(curl --fail --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                "https://api.github.com/repos/jonwong84/fft-experimental-project/pulls/${pull_request_number}") || {
                  echo "GitHub pull request lookup failed for PR ${pull_request_number}."
                  exit 1
                }

              pull_request_base=$(printf '%s' "${pull_request_json}" | jq --raw-output --exit-status '.base.ref | strings | select(length > 0)') || {
                echo "GitHub pull request ${pull_request_number} did not return a base branch."
                exit 1
              }

              sonar_args+=(
                "/d:sonar.pullrequest.key=${pull_request_number}"
                "/d:sonar.pullrequest.branch=${CIRCLE_BRANCH}"
                "/d:sonar.pullrequest.base=${pull_request_base}"
              )
            fi

            dotnet sonarscanner begin "${sonar_args[@]}"
      - run:
          name: Build solution
          command: |
            mkdir -p scratch/ci/linux
            dotnet build Fft.sln --configuration Release --no-restore
      - run:
          name: Run tests
          command: dotnet test Fft.sln --configuration Release --no-build --no-restore --logger trx --results-directory scratch/ci/linux/trx
      - run:
          name: Convert test reports
          when: always
          command: |
            if compgen -G 'scratch/ci/linux/trx/*.trx' > /dev/null; then
              trx2junit --output scratch/ci/linux/junit scratch/ci/linux/trx/*.trx
            fi
      - store_test_results:
          path: scratch/ci/linux/junit
      - store_artifacts:
          path: scratch/ci/linux
          destination: linux-validation
      - run:
          name: Complete SonarQube Cloud analysis
          command: dotnet sonarscanner end "/d:sonar.token=${SONAR_TOKEN}"

  windows-build-test-launch:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - checkout
      - run:
          name: Install exact x64 SDK and pinned report tool
          command: |
            $ErrorActionPreference = 'Stop'
            New-Item -ItemType Directory -Path scratch/ci/bootstrap -Force | Out-Null
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -UseBasicParsing -OutFile scratch/ci/bootstrap/dotnet-install.ps1
            $sdkVersion = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
            & ./scratch/ci/bootstrap/dotnet-install.ps1 -Version $sdkVersion -Architecture x64 -InstallDir C:/fft-dotnet -NoPath
            & C:/fft-dotnet/dotnet.exe --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & C:/fft-dotnet/dotnet.exe tool install trx2junit --version 2.1.0 --allow-roll-forward --tool-path scratch/ci/tools
            exit $LASTEXITCODE
      - run:
          name: Restore portable solution in locked mode
          command: |
            & C:/fft-dotnet/dotnet.exe restore Fft.sln --locked-mode
            exit $LASTEXITCODE
      - run:
          name: Build headless Core and Engine without the rendering backend
          command: |
            & C:/fft-dotnet/dotnet.exe build src/Fft.Core/Fft.Core.csproj -c Release --no-restore -bl:scratch/ci/headless.binlog
            exit $LASTEXITCODE
      - run:
          name: Build Windows solution
          command: |
            & C:/fft-dotnet/dotnet.exe build Fft.sln -c Release --no-restore -bl:scratch/ci/build.binlog
            exit $LASTEXITCODE
      - run:
          name: Run headless tests on Windows
          command: |
            & C:/fft-dotnet/dotnet.exe test Fft.sln -c Release --no-build --no-restore --logger trx --results-directory scratch/ci/trx
            exit $LASTEXITCODE
      - run:
          name: Publish and check self-contained client without a desktop or assets
          command: |
            & ./tools/ci/Publish-WindowsClient.ps1 -OutputRoot scratch/ci/windows-launch -DotNet C:/fft-dotnet/dotnet.exe
      - run:
          name: Convert test reports even after failure
          when: always
          command: |
            $ErrorActionPreference = 'Stop'
            $env:DOTNET_ROOT = 'C:/fft-dotnet'
            $env:DOTNET_ROOT_X64 = 'C:/fft-dotnet'
            $reports = @(Get-ChildItem scratch/ci/trx -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
            if ($reports.Count -gt 0) {
              & ./scratch/ci/tools/trx2junit.exe --output scratch/ci/junit @reports
              exit $LASTEXITCODE
            }
      - store_test_results:
          path: scratch/ci/junit
      - store_artifacts:
          path: scratch/ci
          destination: windows-validation

workflows:
  build-test-scan:
    jobs:
      - build-test-sonar:
          context: global-v1
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/
                - /^codex\/.*/
      - windows-build-test-launch:
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/
                - /^codex\/.*/
